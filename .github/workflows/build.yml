name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          sw_vers
          swiftc --version

      - name: Build app
        shell: bash
        run: |
          if [[ -n "$TAG" ]]; then
            export VERSION="${TAG#v}"
          fi
          bash build.sh 2>&1 | tee build.log

      - name: Report compiler errors
        if: failure()
        shell: bash
        run: |
          sed -nE 's#^(\./)?([^: ]+\.swift):([0-9]+):([0-9]+): error: (.*)$#::error file=\2,line=\3,col=\4::\5#p' build.log | head -50

      - name: Package
        shell: bash
        run: |
          if [[ -n "$TAG" ]]; then
            ZIP="HDMI-Capture-${TAG#v}.zip"
          else
            ZIP="HDMI-Capture-${GITHUB_SHA::7}.zip"
          fi
          ditto -c -k --sequesterRsrc --keepParent "build/HDMI Capture.app" "$ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          ls -l "$ZIP"

      - name: Attach to release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$ZIP" --clobber
